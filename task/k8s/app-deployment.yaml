apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: models
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/example/research-api:2c41f0a
          envFrom:
            - configMapRef:
                name: app-config
          ports:
            - containerPort: 8080
